#### general settings
name: train_quick_smallNet_300iter
use_tb_logger: false
model: LLFlow
distortion: sr
scale: 1
gpu_ids: [0]
dataset: LoL
optimize_all_z: false
cond_encoder: ConEncoder1
train_gt_ratio: 0.2
avg_color_map: false

concat_histeq: true
histeq_as_input: false
concat_color_map: false
gray_map: false

align_condition_feature: false
align_weight: 0.001
align_maxpool: true

to_yuv: false

encode_color_map: false
le_curve: false

#### datasets
datasets:
  train:
    root: D:\LOLdataset
    quant: 32
    use_shuffle: true
    n_workers: 1
    batch_size: 4
    use_flip: true
    color: RGB
    use_crop: true
    GT_size: 128
    noise_prob: 0
    noise_level: 5
    log_low: true
    gamma_aug: false

  val:
    root: D:\LOLdataset
    n_workers: 1
    quant: 32
    n_max: 20
    batch_size: 1
    log_low: true

#### Test Settings
dataroot_unpaired: test_image_unpaired
dataroot_GT: test_pairs/high
dataroot_LR: test_pairs/low
model_path: weights/LOL_smallNet.pth
heat: 0

#### network structures
network_G:
  which_model_G: LLFlow
  in_nc: 3
  out_nc: 3
  nf: 32
  nb: 4
  train_RRDB: false
  train_RRDB_delay: 0.5

  flow:
    K: 4
    L: 3
    noInitialInj: true
    coupling: CondAffineSeparatedAndCond
    additionalFlowNoAffine: 2
    conditionInFeaDim: 64
    split:
      enable: false
    fea_up0: true
    stackRRDB:
      blocks: [1]
      concat: true

#### path
path:
  strict_load: true
  resume_state: auto

#### training settings: learning rate scheme, loss
train:
  manual_seed: 10
  lr_G: !!float 5e-4
  weight_decay_G: 0
  beta1: 0.9
  beta2: 0.99
  lr_scheme: MultiStepLR
  warmup_iter: -1
  lr_steps_rel: [0.5, 0.75, 0.9, 0.95]
  lr_gamma: 0.5

  weight_l1: 0
  weight_fl: 1

  niter: 300
  val_freq: 100

#### validation settings
val:
  n_sample: 4

test:
  heats: [0.0, 0.7, 0.8, 0.9]

#### logger
logger:
  print_freq: 10
  save_checkpoint_freq: 100